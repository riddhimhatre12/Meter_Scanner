<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MeterBot — AI Assistant</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        *{box-sizing:border-box;margin:0;padding:0}

        :root{
            --accent:  #4f8ef7;
            --accent2: #7c5af7;
            --bg:      #0f1724;
            --surface: #182035;
            --surface2:#1e2a42;
            --border:  rgba(79,142,247,.18);
            --text:    #e2e8f8;
            --muted:   #8899bb;
            --bubble-bot: #1a2d50;
            --bubble-user: linear-gradient(135deg,#4f8ef7,#7c5af7);
            --radius: 18px;
        }

        body{
            font-family:'Segoe UI',system-ui,sans-serif;
            background:var(--bg);
            color:var(--text);
            height:100vh;
            display:flex;
            flex-direction:column;
            overflow:hidden;
        }

        /* ── Header ── */
        .chat-header{
            display:flex;
            align-items:center;
            gap:.75rem;
            padding:.85rem 1rem;
            background:var(--surface);
            border-bottom:1px solid var(--border);
            flex-shrink:0;
        }
        .bot-avatar{
            width:40px;height:40px;
            border-radius:50%;
            background:linear-gradient(135deg,#4f8ef7,#7c5af7);
            display:flex;align-items:center;justify-content:center;
            font-size:1.2rem;
            flex-shrink:0;
            box-shadow:0 0 12px rgba(79,142,247,.4);
        }
        .bot-info h6{margin:0;font-size:.9rem;font-weight:700;color:var(--text);}
        .bot-info span{font-size:.72rem;color:var(--muted);}
        .online-dot{
            display:inline-block;
            width:7px;height:7px;
            border-radius:50%;
            background:#22d3a0;
            margin-right:4px;
            animation:pulse-dot 2s infinite;
        }
        @keyframes pulse-dot{
            0%,100%{box-shadow:0 0 0 0 rgba(34,211,160,.5);}
            50%{box-shadow:0 0 0 4px rgba(34,211,160,0);}
        }
        .powered{
            margin-left:auto;
            font-size:.65rem;
            color:var(--muted);
            background:rgba(79,142,247,.1);
            border:1px solid var(--border);
            padding:.2rem .55rem;
            border-radius:20px;
        }

        /* ── Messages area ── */
        #chat-messages{
            flex:1;
            overflow-y:auto;
            padding:1.1rem 1rem;
            display:flex;
            flex-direction:column;
            gap:.85rem;
            scroll-behavior:smooth;
        }
        #chat-messages::-webkit-scrollbar{width:4px;}
        #chat-messages::-webkit-scrollbar-track{background:transparent;}
        #chat-messages::-webkit-scrollbar-thumb{background:rgba(79,142,247,.25);border-radius:4px;}

        /* ── Message rows ── */
        .msg-row{display:flex;align-items:flex-end;gap:.6rem;animation:slideUp .25s ease-out both;}
        .msg-row.user{flex-direction:row-reverse;}
        @keyframes slideUp{
            from{opacity:0;transform:translateY(10px);}
            to{opacity:1;transform:translateY(0);}
        }

        .msg-avatar{
            width:30px;height:30px;
            border-radius:50%;
            background:linear-gradient(135deg,#4f8ef7,#7c5af7);
            display:flex;align-items:center;justify-content:center;
            font-size:.85rem;
            flex-shrink:0;
        }
        .msg-avatar.user-av{background:linear-gradient(135deg,#7c5af7,#a855f7);}

        .bubble{
            max-width:82%;
            padding:.75rem 1rem;
            border-radius:var(--radius);
            font-size:.875rem;
            line-height:1.6;
            white-space:pre-wrap;
            word-break:break-word;
        }
        .bubble.bot{
            background:var(--bubble-bot);
            border:1px solid var(--border);
            border-bottom-left-radius:4px;
            color:var(--text);
        }
        .bubble.user{
            background:var(--bubble-user);
            color:#fff;
            border-bottom-right-radius:4px;
        }
        .bubble strong{color:#7ddcff;font-weight:700;}
        .bubble.user strong{color:#fff;}

        .msg-time{
            font-size:.62rem;
            color:var(--muted);
            margin-top:.3rem;
            padding:0 .2rem;
        }
        .msg-meta{display:flex;flex-direction:column;max-width:82%;}
        .msg-meta.user-meta{align-items:flex-end;}

        /* ── Typing indicator ── */
        #typing{display:none;align-items:flex-end;gap:.6rem;}
        .typing-bubble{
            background:var(--bubble-bot);
            border:1px solid var(--border);
            border-radius:var(--radius);
            border-bottom-left-radius:4px;
            padding:.6rem .9rem;
            display:flex;gap:4px;align-items:center;
        }
        .dot{width:7px;height:7px;border-radius:50%;background:var(--accent);animation:typeDot 1.2s infinite;}
        .dot:nth-child(2){animation-delay:.2s;}
        .dot:nth-child(3){animation-delay:.4s;}
        @keyframes typeDot{
            0%,80%,100%{transform:scale(.6);opacity:.4;}
            40%{transform:scale(1);opacity:1;}
        }

        /* ── Quick chips ── */
        .quick-wrap{
            padding:.55rem .8rem;
            background:var(--surface);
            border-top:1px solid var(--border);
            display:flex;flex-wrap:wrap;gap:.45rem;
            flex-shrink:0;
        }
        .chip{
            background:var(--surface2);
            border:1px solid var(--border);
            color:var(--muted);
            border-radius:20px;
            padding:.3rem .75rem;
            font-size:.72rem;
            cursor:pointer;
            transition:all .2s;
            white-space:nowrap;
        }
        .chip:hover{
            background:rgba(79,142,247,.15);
            border-color:var(--accent);
            color:var(--accent);
            transform:translateY(-1px);
        }

        /* ── Input row ── */
        .input-row{
            display:flex;
            align-items:center;
            gap:.55rem;
            padding:.7rem .8rem;
            background:var(--surface);
            border-top:1px solid var(--border);
            flex-shrink:0;
        }
        #msg-input{
            flex:1;
            background:var(--surface2);
            border:1px solid var(--border);
            border-radius:24px;
            padding:.6rem 1rem;
            color:var(--text);
            font-size:.875rem;
            outline:none;
            transition:border-color .2s;
        }
        #msg-input::placeholder{color:var(--muted);}
        #msg-input:focus{border-color:var(--accent);}
        #send-btn{
            width:38px;height:38px;
            border-radius:50%;
            border:none;
            background:linear-gradient(135deg,#4f8ef7,#7c5af7);
            color:#fff;
            display:flex;align-items:center;justify-content:center;
            cursor:pointer;
            font-size:1rem;
            transition:all .2s;
            flex-shrink:0;
            box-shadow:0 2px 10px rgba(79,142,247,.4);
        }
        #send-btn:hover{transform:scale(1.1);box-shadow:0 4px 18px rgba(79,142,247,.55);}
        #send-btn:disabled{opacity:.5;pointer-events:none;}
    </style>
</head>
<body>

<!-- Header -->
<div class="chat-header">
    <div class="bot-avatar">🤖</div>
    <div class="bot-info">
        <h6>MeterBot</h6>
        <span><span class="online-dot"></span>Online · Meter Scanner Pro</span>
    </div>
    <div class="powered">AI Powered</div>
</div>

<!-- Messages -->
<div id="chat-messages">
    <!-- Welcome -->
    <div class="msg-row bot" id="welcome-row">
        <div class="msg-avatar">🤖</div>
        <div class="msg-meta">
            <div class="bubble bot">👋 Hello! I'm <strong>MeterBot</strong>, your smart energy assistant.

I can help you scan meters, calculate bills, track usage, set up alerts, and much more — all within <strong>Meter Scanner Pro</strong>.

What would you like help with today?</div>
            <div class="msg-time">Just now</div>
        </div>
    </div>
    <!-- Typing -->
    <div id="typing">
        <div class="msg-avatar">🤖</div>
        <div class="typing-bubble">
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
        </div>
    </div>
</div>

<!-- Quick chips -->
<div class="quick-wrap" id="quick-wrap">
    <button class="chip" onclick="sendChip(this)">📷 How to scan?</button>
    <button class="chip" onclick="sendChip(this)">💰 Calculate bill</button>
    <button class="chip" onclick="sendChip(this)">⚡ Electricity slabs</button>
    <button class="chip" onclick="sendChip(this)">🔔 Set up alerts</button>
    <button class="chip" onclick="sendChip(this)">💡 Energy saving tips</button>
    <button class="chip" onclick="sendChip(this)">📁 Export my data</button>
    <button class="chip" onclick="sendChip(this)">🔧 Scanning trouble</button>
    <button class="chip" onclick="sendChip(this)">👤 Account / login</button>
</div>

<!-- Input -->
<div class="input-row">
    <input id="msg-input" type="text" placeholder="Ask me anything about your meter…" autocomplete="off">
    <button id="send-btn" onclick="send()"><i class="bi bi-send-fill"></i></button>
</div>

<script>
const messagesEl = document.getElementById('chat-messages');
const typingEl   = document.getElementById('typing');
const inputEl    = document.getElementById('msg-input');
const sendBtn    = document.getElementById('send-btn');

function now(){
    return new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
}

/* Render **bold** markdown */
function renderMd(text){
    return text
        .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
        .replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');
}

function addMsg(text, isUser){
    const row = document.createElement('div');
    row.className = 'msg-row ' + (isUser ? 'user' : 'bot');

    const meta = document.createElement('div');
    meta.className = 'msg-meta ' + (isUser ? 'user-meta' : '');

    const bubble = document.createElement('div');
    bubble.className = 'bubble ' + (isUser ? 'user' : 'bot');
    bubble.innerHTML = renderMd(text);

    const time = document.createElement('div');
    time.className = 'msg-time';
    time.textContent = now();

    meta.appendChild(bubble);
    meta.appendChild(time);

    if(!isUser){
        const av = document.createElement('div');
        av.className = 'msg-avatar';
        av.textContent = '🤖';
        row.appendChild(av);
    } else {
        const av = document.createElement('div');
        av.className = 'msg-avatar user-av';
        av.textContent = '👤';
        row.appendChild(av);
    }
    row.appendChild(meta);

    /* insert before typing indicator */
    messagesEl.insertBefore(row, typingEl);
    messagesEl.scrollTop = messagesEl.scrollHeight;
}

function setLoading(v){
    typingEl.style.display = v ? 'flex' : 'none';
    sendBtn.disabled = v;
    inputEl.disabled = v;
    if(v) messagesEl.scrollTop = messagesEl.scrollHeight;
}

async function send(){
    const text = inputEl.value.trim();
    if(!text) return;
    inputEl.value = '';
    addMsg(text, true);
    setLoading(true);

    /* hide chips after first message */
    document.getElementById('quick-wrap').style.display='none';

    try{
        const res  = await fetch('/chat',{
            method:'POST',
            headers:{'Content-Type':'application/json'},
            body:JSON.stringify({message:text}),
            credentials:'same-origin'
        });
        const data = await res.json();
        setTimeout(()=>{
            setLoading(false);
            addMsg(data.response, false);
        }, 400);
    } catch(e){
        setLoading(false);
        addMsg("⚠️ Connection error. Please try again.", false);
    } finally {
        inputEl.focus();
    }
}

function sendChip(btn){
    inputEl.value = btn.textContent.replace(/^[\p{Emoji}\s]+/u,'').trim();
    send();
}

inputEl.addEventListener('keydown', e=>{
    if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); send(); }
});

/* Theme sync from parent */
if(window.parent !== window){
    window.addEventListener('message', e=>{
        if(e.data && e.data.type==='themeChange'){/* already dark-only */}
    });
    window.parent.postMessage({type:'themeRequest'},'*');
}

inputEl.focus();
</script>
</body>
</html>
