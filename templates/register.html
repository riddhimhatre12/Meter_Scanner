{% extends "base.html" %}

{% block title %}Register{% endblock %}

{% block content %}
<style>
.auth-page {
    min-height: calc(100vh - 68px);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem 1rem;
    background:
        radial-gradient(ellipse at 20% 50%, rgba(79,142,247,0.12) 0%, transparent 60%),
        radial-gradient(ellipse at 80% 20%, rgba(124,90,247,0.10) 0%, transparent 55%);
}
.auth-card {
    width: 100%; max-width: 480px;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(79,142,247,0.2);
    border-radius: 24px;
    backdrop-filter: blur(20px);
    box-shadow: 0 20px 60px rgba(0,0,0,0.5), 0 0 0 1px rgba(255,255,255,0.06);
    animation: scaleIn 0.45s ease-out both;
    overflow: hidden;
}
.auth-card-header {
    padding: 1.75rem 2rem 1rem;
    text-align: center;
    border-bottom: 1px solid rgba(79,142,247,0.15);
}
.auth-logo {
    width: 52px; height: 52px;
    background: linear-gradient(135deg,#4f8ef7,#7c5af7);
    border-radius: 14px;
    display: flex; align-items: center; justify-content: center;
    font-size: 1.5rem; margin: 0 auto 0.8rem;
    box-shadow: 0 8px 24px rgba(79,142,247,0.4);
    animation: fadeInDown 0.5s ease-out both;
}
.auth-title {
    font-size: 1.45rem; font-weight: 800;
    background: linear-gradient(135deg,#e2e8f8,#a8c5f7);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent; margin: 0;
    animation: fadeInUp 0.5s ease-out 0.1s both;
}
.auth-subtitle {
    color: #8899bb; font-size: 0.82rem;
    margin-top: 0.3rem;
    animation: fadeInUp 0.5s ease-out 0.15s both;
}
.auth-card-body { padding: 1.5rem 2rem; }
.form-field { margin-bottom: 0.95rem; animation: fadeInUp 0.5s ease-out both; }
.form-field:nth-child(1){ animation-delay:.18s }
.form-field:nth-child(2){ animation-delay:.24s }
.form-field:nth-child(3){ animation-delay:.30s }
.form-field:nth-child(4){ animation-delay:.36s }
.field-label {
    display: block; font-size: 0.76rem; font-weight: 700;
    color: #8899bb; text-transform: uppercase; letter-spacing: 0.6px; margin-bottom: 0.45rem;
}
.field-input {
    width: 100%;
    background: rgba(255,255,255,0.07);
    border: 1px solid rgba(79,142,247,0.2);
    border-radius: 12px; padding: 0.75rem 1rem;
    color: #e2e8f8; font-size: 0.88rem; outline: none; transition: all 0.25s;
}
.field-input::placeholder { color: #4a5a7a; }
.field-input:focus {
    background: rgba(79,142,247,0.08);
    border-color: #4f8ef7; box-shadow: 0 0 0 3px rgba(79,142,247,0.18);
}
.btn-submit {
    width: 100%; padding: 0.82rem;
    background: linear-gradient(135deg,#4f8ef7,#7c5af7);
    border: none; border-radius: 12px; color: #fff;
    font-size: 0.92rem; font-weight: 700; cursor: pointer;
    transition: all 0.25s; box-shadow: 0 4px 18px rgba(79,142,247,0.35);
    animation: fadeInUp 0.5s ease-out 0.42s both;
}
.btn-submit:hover { transform: translateY(-2px); box-shadow: 0 8px 28px rgba(79,142,247,0.55); }
.divider {
    display: flex; align-items: center; gap: 0.9rem; margin: 1.1rem 0;
    animation: fadeIn 0.5s ease-out 0.48s both;
}
.divider-line { flex:1; height:1px; background:rgba(79,142,247,0.2); }
.divider-or { color:#4a5a7a; font-size:0.76rem; font-weight:600; letter-spacing:0.5px; }
.btn-google-dark {
    width: 100%; display: flex; align-items: center; justify-content: center; gap: 0.7rem;
    padding: 0.76rem 1rem;
    background: rgba(255,255,255,0.06); border: 1px solid rgba(79,142,247,0.25);
    border-radius: 12px; color: #e2e8f8; font-size: 0.88rem; font-weight: 600;
    text-decoration: none; transition: all 0.25s;
    animation: fadeInUp 0.5s ease-out 0.52s both;
}
.btn-google-dark:hover {
    background: rgba(79,142,247,0.12); border-color: #4f8ef7; color: #fff;
    transform: translateY(-1px); text-decoration: none;
}
.google-icon {
    font-size: 1.05rem;
    background: linear-gradient(135deg,#4285F4,#EA4335,#FBBC05,#34A853);
    -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
}
.auth-footer {
    padding: 0.9rem 2rem 1.4rem; text-align: center;
    color: #4a5a7a; font-size: 0.82rem;
    border-top: 1px solid rgba(79,142,247,0.12);
    animation: fadeIn 0.5s ease-out 0.55s both;
}
.auth-footer a { color: #4f8ef7; font-weight: 600; text-decoration: none; }
.auth-footer a:hover { color: #00cfff; }
</style>

<div class="auth-page">
  <div class="auth-card">
    <div class="auth-card-header">
        <div class="auth-logo">⚡</div>
        <h1 class="auth-title">Create Account</h1>
        <p class="auth-subtitle">Join Meter Scanner Pro — it's free</p>
    </div>
    <div class="auth-card-body">
        <form method="POST">
          <div class="form-field">
            <label class="field-label" for="username">Username</label>
            <input type="text" class="field-input" id="username" name="username" placeholder="Choose a username" required>
          </div>
          <div class="form-field">
            <label class="field-label" for="email">Email</label>
            <input type="email" class="field-input" id="email" name="email" placeholder="your@email.com" required>
          </div>
          <div class="form-field">
            <label class="field-label" for="password">Password</label>
            <input type="password" class="field-input" id="password" name="password" placeholder="Create a password" required>
          </div>
          <div class="form-field">
            <label class="field-label" for="confirm_password">Confirm Password</label>
            <input type="password" class="field-input" id="confirm_password" name="confirm_password" placeholder="Repeat password" required>
          </div>
          <button type="submit" class="btn-submit">🚀 Create Account</button>
        </form>

        <div class="divider">
            <div class="divider-line"></div>
            <span class="divider-or">OR</span>
            <div class="divider-line"></div>
        </div>

        <a href="{{ url_for('google_login') }}" class="btn-google-dark">
            <i class="bi bi-google google-icon"></i>
            Sign up with Google
        </a>
    </div>
    <div class="auth-footer">
        Already have an account? <a href="{{ url_for('login') }}">Login here</a>
    </div>
  </div>
</div>
{% endblock %}
