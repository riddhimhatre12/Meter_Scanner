{% extends "base.html" %}

{% block title %}Create Account{% endblock %}

{% block content %}
<div class="row justify-content-center align-items-center py-4" style="min-height: calc(100vh - 140px);">
    <div class="col-12 col-sm-10 col-md-8 col-lg-5 col-xl-4">
        <div class="card p-4">
            <div class="text-center mb-4">
                <div class="brand-badge mx-auto mb-2" style="width: 44px; height: 44px; border-radius: 10px; overflow: hidden; display: inline-flex; align-items: center; justify-content: center; background: #2563eb;">
                    <img src="{{ url_for('static', filename='favicon.png') }}" alt="Logo" style="width: 100%; height: 100%; object-fit: cover;">
                </div>
                <h4 class="font-weight-700 mb-1">Create Account</h4>
                <p class="text-secondary small mb-0">Join Meter Scanner Pro to track utility meters</p>
            </div>

            <form method="POST" class="mb-3">
                <div class="mb-3">
                    <label class="form-label" for="username">Username</label>
                    <input type="text" class="form-control" id="username" name="username" placeholder="Choose a username" required>
                </div>
                <div class="mb-3">
                    <label class="form-label" for="email">Email Address</label>
                    <input type="email" class="form-control" id="email" name="email" placeholder="name@example.com" required>
                </div>
                <div class="mb-3">
                    <label class="form-label" for="password">Password</label>
                    <input type="password" class="form-control" id="password" name="password" placeholder="Create a password" required>
                </div>
                <div class="mb-3">
                    <label class="form-label" for="confirm_password">Confirm Password</label>
                    <input type="password" class="form-control" id="confirm_password" name="confirm_password" placeholder="Confirm password" required>
                </div>
                <button type="submit" class="btn btn-primary w-100 py-2 mt-2">
                    <i class="bi bi-person-plus-fill"></i> Create Account
                </button>
            </form>

            <div class="d-flex align-items-center gap-2 my-3">
                <hr class="flex-grow-1 my-0 border-secondary">
                <span class="text-muted small font-weight-600 uppercase" style="font-size: 0.7rem;">Or continue with</span>
                <hr class="flex-grow-1 my-0 border-secondary">
            </div>

            <a href="{{ url_for('google_login') }}" class="btn btn-outline-secondary w-100 py-2">
                <i class="bi bi-google text-danger me-2"></i> Sign up with Google
            </a>

            <div class="text-center mt-4 pt-2 border-top" style="border-color: var(--border-color) !important;">
                <span class="text-secondary small">Already have an account?</span>
                <a href="{{ url_for('login') }}" class="text-primary font-weight-600 small ms-1">Sign In</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
