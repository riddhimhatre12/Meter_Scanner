{% extends "base.html" %}

{% block title %}Sign In{% endblock %}

{% block content %}
<div class="row justify-content-center align-items-center py-4" style="min-height: calc(100vh - 140px);">
    <div class="col-12 col-sm-10 col-md-8 col-lg-5 col-xl-4">
        <div class="card p-4">
            <div class="text-center mb-4">
                <div class="brand-badge mx-auto mb-2" style="width: 44px; height: 44px; font-size: 1.3rem;">
                    <i class="bi bi-cpu-fill"></i>
                </div>
                <h4 class="font-weight-700 mb-1">Welcome Back</h4>
                <p class="text-secondary small mb-0">Sign in to access your utility dashboard</p>
            </div>

            <form method="POST" class="mb-3">
                <div class="mb-3">
                    <label class="form-label" for="username">Username or Email</label>
                    <input type="text" class="form-control" id="username" name="username"
                           placeholder="name@example.com" required autocomplete="username">
                </div>
                <div class="mb-3">
                    <div class="d-flex justify-content-between align-items-center mb-1">
                        <label class="form-label mb-0" for="password">Password</label>
                    </div>
                    <input type="password" class="form-control" id="password" name="password"
                           placeholder="••••••••" required autocomplete="current-password">
                </div>
                <button type="submit" class="btn btn-primary w-100 py-2 mt-2">
                    <i class="bi bi-box-arrow-in-right"></i> Sign In
                </button>
            </form>

            <div class="d-flex align-items-center gap-2 my-3">
                <hr class="flex-grow-1 my-0 border-secondary">
                <span class="text-muted small font-weight-600 uppercase" style="font-size: 0.7rem;">Or continue with</span>
                <hr class="flex-grow-1 my-0 border-secondary">
            </div>

            <a href="{{ url_for('google_login') }}" class="btn btn-outline-secondary w-100 py-2">
                <i class="bi bi-google text-danger me-2"></i> Continue with Google
            </a>

            <div class="text-center mt-4 pt-2 border-top" style="border-color: var(--border-color) !important;">
                <span class="text-secondary small">Don't have an account?</span>
                <a href="{{ url_for('register') }}" class="text-primary font-weight-600 small ms-1">Create Account</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
